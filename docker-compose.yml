# Both halves of ShotIQ, on one network.
#
#     docker compose up --build
#     open http://localhost:8080
#
# No `version:` key -- it has been obsolete since Compose v2 and now only
# produces a warning.

services:
  api:
    build:
      # Context is the repository root for both images, so a single
      # .dockerignore governs what reaches the daemon.
      context: .
      dockerfile: server/Dockerfile

    # expose, not ports: the API is reachable from the web container on the
    # shared network but is NOT published to the host. nginx is the only
    # way in, which is what makes the frontend's relative /api paths the
    # real production arrangement rather than a development convenience.
    # Publish it temporarily if you want to hit /docs directly.
    expose:
      - "8000"

    # Optional, and it must stay optional: the whole point of committing
    # the cached summary is that this runs with no key at all. Someone who
    # has created server/.env gets their key passed through at runtime,
    # never baked into an image layer.
    env_file:
      - path: ./server/.env
        required: false

    # SHOTIQ_SUMMARY_LIVE is deliberately NOT set here. config.py defaults
    # it to false, so the fail-closed behaviour has one definition rather
    # than two that can disagree -- and setting it here would override the
    # developer's own .env, which is the opposite of helpful.

    # Named volume seeded from the image. Docker copies the image's
    # contents into an empty named volume on first mount, so this starts
    # with the committed cache and then keeps anything fetched afterwards
    # instead of losing it when the container is replaced.
    volumes:
      - shotiq-cache:/app/cache

    restart: unless-stopped

  # The queue's storage. Alpine, and tiny: the image is ~15 MB and it idles
  # under 10 MB of RAM, which matters on a host that gives Docker 2.78 GB.
  redis:
    image: redis:alpine

    # Not published. Nothing outside this network has any business talking
    # to it, and an exposed Redis with no password is one of the most
    # reliably exploited misconfigurations there is.
    expose:
      - "6379"

    # Persistence, so a `docker compose down` does not silently drop queued
    # jobs. The whole argument for a real queue over an in-memory one is
    # that work survives a restart; a Redis with no volume would give that
    # back at the container level after establishing it at the process
    # level.
    volumes:
      - shotiq-redis:/data
    command: ["redis-server", "--appendonly", "yes"]

    # Depended on by both worker services, so it has to report readiness
    # rather than merely existing -- BullMQ connecting before Redis accepts
    # commands is a startup crash loop.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    restart: unless-stopped

  # The job API. Same image as `worker` below, different command.
  worker-api:
    build:
      context: .
      dockerfile: worker/Dockerfile

    # Published, unlike `api`, and for one reason: /docs. It is how the
    # queue is driven by hand and the clearest demonstration that the
    # service exists. Nothing in the dashboard calls it.
    ports:
      - "3001:3001"

    environment:
      # Service names, not 127.0.0.1. Inside a container, loopback is the
      # container's own -- the IPv6-versus-IPv4 problem that forces
      # 127.0.0.1 on the host does not arise here, because Compose's DNS
      # resolves these correctly either way.
      REDIS_URL: redis://redis:6379
      SHOTIQ_API_URL: http://api:8000
      WORKER_PORT: "3001"

    depends_on:
      redis:
        condition: service_healthy
      # Waits for the Python API to be HEALTHY, not merely started. The
      # worker calls it, and a job that runs before uvicorn has finished
      # importing pandas fails for a reason that has nothing to do with the
      # job.
      api:
        condition: service_healthy

    restart: unless-stopped

  # The consumer. Identical image, no HTTP surface.
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["node", "dist/worker/index.js"]

    environment:
      REDIS_URL: redis://redis:6379
      SHOTIQ_API_URL: http://api:8000

    # The image's healthcheck probes :3001, which this process does not
    # serve. Left as-is it would report unhealthy forever and invite a
    # restart loop, so it is disabled rather than replaced -- a consumer's
    # health is "is it draining the queue", which a container-level check
    # cannot see.
    healthcheck:
      disable: true

    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile

    # 8080 rather than 80, which usually needs privileges on the host and
    # is often already taken.
    ports:
      - "8080:80"

    # Waits for the API's HEALTHCHECK to pass, not merely for its container
    # to exist. Without the condition, nginx can start while uvicorn is
    # still importing pandas, and the first request through /api gets a
    # 502 from a service that was simply not ready yet.
    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped

volumes:
  shotiq-cache:
  shotiq-redis:
