# nginx serves the built React app and proxies /api to the Python service.
#
# This is what makes the frontend's relative paths work in production. The
# app calls fetch('/api/shots') with no host in it, exactly as it does in
# development behind Vite's proxy, so no build-time environment variable
# decides where the API lives -- nginx does, at runtime.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The bundle is ~570 kB, most of it Recharts, and compresses to about
    # 170 kB. gzip_static is not used because the image does not ship
    # pre-compressed files; compressing per request is cheap at this size.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints these filenames with a content hash, so a given URL
    # can never mean different bytes later. That is precisely the case
    # immutable exists for.
    location /assets/ {
        # One header, not two. `expires 1y` emits its own Cache-Control, so
        # pairing it with add_header sends the field twice -- legal, since
        # clients join them, but it means two directives to keep in step.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must NOT be cached that way. It is the file that names
    # which hashed bundle to load, so a cached copy would keep pointing at
    # the previous deploy's assets long after they were replaced.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        # 'api' is the service name in docker-compose.yml, resolved by
        # Docker's embedded DNS on the shared network. No IP addresses and
        # no links: the containers find each other by name.
        proxy_pass http://api:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx defaults to a 60s read timeout. The API allows itself 90s
        # to reach stats.nba.com (NBA_TIMEOUT_SECONDS), which is slow and
        # unofficial -- so a genuinely slow first fetch for an uncached
        # player would be cut off by nginx at 60s and returned as 504
        # while the API was still waiting perfectly happily. This has to
        # exceed the timeout the application gives itself.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # SPA fallback: any unknown path returns index.html rather than a 404,
    # so client-side routing keeps working if this app ever gains it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
